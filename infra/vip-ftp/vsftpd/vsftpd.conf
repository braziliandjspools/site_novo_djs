listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=NO
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
pasv_enable=YES
pasv_promiscuous=NO
pasv_min_port=21100
pasv_max_port=21110
# Substituído no entrypoint pelo FTP_PASV_ADDRESS
pasv_address=127.0.0.1
local_umask=022
file_open_mode=0644
ascii_upload_enable=NO
ascii_download_enable=NO
ftpd_banner=BRS VIP FTP — somente leitura (espelho Google Drive)
download_enable=YES
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO
tcp_wrappers=NO
max_clients=50
max_per_ip=5
idle_session_timeout=600
data_connection_timeout=300
