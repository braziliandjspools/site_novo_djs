# Espelho Google Drive → disco + FTP (FileZilla)
# Uso: cp .env.example .env && cp rclone/rclone.conf.example rclone/rclone.conf
#      # coloque service-account.json em rclone/
#      docker compose up -d --build

services:
  sync:
    image: rclone/rclone:1.68.2
    container_name: brs-vip-ftp-sync
    restart: unless-stopped
    env_file: .env
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - ./rclone:/config/rclone:ro
      - ./scripts/sync.sh:/sync.sh:ro
      - music_data:/data/music
    entrypoint: ["/bin/sh", "/sync.sh"]

  ftp:
    build:
      context: ./vsftpd
    container_name: brs-vip-ftp
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FTP_PORT:-21}:21"
      - "${FTP_PASV_MIN:-21100}-${FTP_PASV_MAX:-21110}:${FTP_PASV_MIN:-21100}-${FTP_PASV_MAX:-21110}"
    volumes:
      - music_data:/data/music
    depends_on:
      - sync

volumes:
  music_data:
    name: brs-vip-ftp-music
